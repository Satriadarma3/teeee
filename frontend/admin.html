<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<title>Admin Console – SIT</title></head>
<body>
<header class="sit-nav">
  <a class="brand" href="kalender.html">SIT</a>
  <a class="nav-pill" href="kalender.html">Kalender &amp; Iuran</a>
  <a class="nav-pill" href="profil.html">Profil</a>
  <a class="nav-pill on" href="admin.html" aria-current="page">Admin Console</a>
  <span class="who" data-user-label>J. Doe · 2210XXXX</span>
</header>
<header class="m-top">
  <div class="row1"><div class="logo-sq">SIT</div><b class="flex-grow-1">SIT Mahasiswa</b>
    <a class="avatar-sm" href="profil.html" aria-label="Profil" data-user-initials>JD</a></div>
  <nav class="m-tabs">
    <a href="kalender.html">Kalender</a>
    <a href="profil.html">Profil</a>
    <a href="admin.html" class="on" aria-current="page">Admin</a>
  </nav>
</header>

<main>
<section class="sit-hero d-none d-md-block" style="padding:36px 32px">
  <h1 class="fs-2 fw-bold mb-0" style="font-size:30px">Admin Console</h1><p class="mb-0 mt-1">Kelola pembayaran, event, rekrutmen, dan tugas.</p></section>
<section class="d-md-none" style="padding:16px 16px 4px"><h1 class="fs-4 fw-bold mb-0">Admin Console</h1>
  <div class="small muted">Kelola pembayaran, event, rekrutmen, dan tugas.</div></section>

<div class="page-pad">
  <div class="sit-card p-3 p-md-4">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <div class="scroll-x wrap-md" id="tabs" style="max-width:100%"></div>
      <span class="flex-grow-1 d-none d-md-block"></span>
      <button class="btn btn-sit w-100 w-md-auto" id="btnAdd"></button>
    </div>
    <div id="empty" class="soft-box text-center muted small d-none">Belum ada data.</div>
    <!-- desktop: tabel -->
    <div class="d-none d-md-block" style="overflow-x:auto" id="tableWrap">
      <table class="adm-table"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
    <!-- mobile: kartu -->
    <div class="d-md-none" id="cards"></div>
  </div>
</div>
</main>

<div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="fmHead" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width:520px"><div class="modal-content"><div class="modal-body">
    <div class="sheet-handle"></div>
    <div class="d-flex justify-content-between align-items-center"><h2 class="fs-4 fw-bold mb-0" id="fmHead"></h2>
      <button type="button" class="btn btn-sit-o btn-icon" data-bs-dismiss="modal" aria-label="Tutup">X</button></div>
    <label class="form-label" for="a1">Judul</label><input id="a1" class="form-control">
    <div class="row g-3"><div class="col-6"><label class="form-label" for="a2">Mulai (Okt)</label><input id="a2" class="form-control" inputmode="numeric"></div>
      <div class="col-6"><label class="form-label" for="a3">Selesai (Okt)</label><input id="a3" class="form-control" inputmode="numeric"></div></div>
    <label class="form-label" for="a4">Lokasi</label><input id="a4" class="form-control">
    <label class="form-label" for="a5">Ringkasan (tooltip)</label><input id="a5" class="form-control">
    <div id="amtWrap" class="d-none"><label class="form-label" for="a6">Nominal</label><input id="a6" class="form-control"></div>
    <div class="row g-2 mt-3 justify-content-md-end"><div class="col-6 col-md-auto"><button class="btn btn-sit-o w-100" data-bs-dismiss="modal">Batal</button></div>
      <div class="col-6 col-md-auto"><button class="btn btn-sit w-100" id="fmSave">Simpan</button></div></div>
  </div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script><script src="js/admin.js"></script>
</body></html>
