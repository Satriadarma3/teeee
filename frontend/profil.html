<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
<title>Profil – SIT</title></head>
<body>
<header class="sit-nav">
  <a class="brand" href="kalender.html">SIT</a>
  <a class="nav-pill" href="kalender.html">Kalender &amp; Iuran</a>
  <a class="nav-pill on" href="profil.html" aria-current="page">Profil</a>
  <a class="nav-pill admin-only d-none" href="admin.html">Admin Console</a>
  <span class="who" data-user-label>J. Doe · 2210XXXX</span>
</header>
<header class="m-top">
  <div class="row1"><div class="logo-sq">SIT</div><b class="flex-grow-1">SIT Mahasiswa</b>
    <a class="avatar-sm" href="profil.html" aria-label="Profil" data-user-initials>JD</a></div>
  <nav class="m-tabs">
    <a href="kalender.html">Kalender</a>
    <a href="profil.html" class="on" aria-current="page">Profil</a>
    <a href="admin.html" class="admin-only d-none">Admin</a>
  </nav>
</header>

<main class="mx-auto" style="max-width:1184px">
<div class="page-pad" style="padding-top:32px;padding-bottom:0">
  <h1 class="fs-2 fw-bold mb-4 d-none d-md-block">Profil</h1>
  <div class="row g-4 align-items-start">
    <!-- kartu profil -->
    <div class="col-12 col-lg-4 col-xl-3">
      <section class="sit-card p-4 text-center" style="padding:24px">
        <div class="avatar-lg" id="avatar"></div>
        <label for="ph" class="d-flex justify-content-center align-items-center fw-semibold" style="min-height:44px;color:#1D4ED8;cursor:pointer">Ganti foto</label>
        <input id="ph" type="file" accept="image/*" class="d-none">
        <h2 class="fs-4 fw-bold mb-0" id="pName"></h2>
        <div class="small muted mt-1 mb-2" id="pMeta"></div><span class="pill pill-info" id="pRole">Mahasiswa</span>
        <div class="row g-2 my-3"><div class="col-6"><button class="btn btn-sit-o w-100" id="btnEdit">Edit profil</button></div>
          <div class="col-6"><a class="btn btn-sit-o w-100" href="index.html">Keluar</a></div></div>
        <div class="d-none d-lg-block text-start" id="statsSide"></div>
      </section>
      <div class="row g-2 mt-1 d-lg-none" id="statsMini"></div>
    </div>
    <!-- konten -->
    <div class="col-12 col-lg-8 col-xl-9 d-grid gap-3">
      <div class="seg" id="seg"></div>
      <div class="row g-3" id="items"></div>
      <section class="sit-card p-4" style="padding:24px">
        <div class="d-flex justify-content-between align-items-center"><h3 class="fs-5 fw-bold mb-0">Riwayat iuran</h3><span class="pill pill-neutral">Hanya baca</span></div>
        <div class="small muted my-2">Total terbayar <b style="color:#0F2A4A">Rp 50.000</b></div>
        <div id="dues"></div>
        <div class="small muted mt-2">Data sinkron dari spreadsheet kas dan tidak dapat diubah dari sini.</div>
      </section>
    </div>
  </div>
  <div class="mt-5 pt-3 small muted d-none d-md-block" style="border-top:1px solid var(--sit-line)">© 2026 SIT Mahasiswa · Fasilkom Unsoed</div>
  <div style="height:32px"></div>
</div>
</main>

<div class="modal fade" id="sheet" tabindex="-1" aria-labelledby="shTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width:520px"><div class="modal-content"><div class="modal-body sheet-body">
    <div class="sheet-handle"></div>
    <div class="d-flex justify-content-between align-items-center"><h2 class="fs-4 fw-bold mb-0" id="shTitle"></h2>
      <button type="button" class="btn btn-sit-o btn-icon" data-bs-dismiss="modal" aria-label="Tutup">X</button></div>
    <div id="shBody"></div>
    <div class="d-flex justify-content-end gap-2 mt-4">
      <button class="btn btn-sit-o d-none d-md-inline-flex" data-bs-dismiss="modal">Batal</button>
      <button class="btn btn-sit w-100 w-md-auto" id="shSave"></button></div>
  </div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script><script src="js/profil.js"></script>
</body></html>
